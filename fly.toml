# Fly.io deployment for bugspotter-mcp.
# Region: Frankfurt (fra) — closest datacenter to the KZ-resident backend
# at api.kz.bugspotter.io with reasonable transit latency.
#
# Deploy:   flyctl deploy
# Logs:     flyctl logs
# Status:   flyctl status

app = "bugspotter-mcp"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  LOG_DIR = "/var/log/bugspotter-mcp"
  MCP_LOG_FORMAT = "json"

[http_service]
  internal_port = 8080
  force_https = true
  # CRITICAL: do NOT scale to zero — MCP sessions live in-process memory.
  # A cold start (~3s) kills active SSE streams and forces agents to
  # re-handshake. Keep at least one machine warm at all times.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  # 512 MB is sized for ~100 concurrent sessions. Bump to 1024mb if
  # active sessions exceed that threshold.

# Optional — persistent volume for JSONL behavioral logs.
# Without this, logs are lost when the machine restarts. For production
# log retention, uncomment and run `flyctl volumes create mcp_logs --size 1`.
# [mounts]
#   source = "mcp_logs"
#   destination = "/var/log/bugspotter-mcp"
#   initial_size = "1gb"
