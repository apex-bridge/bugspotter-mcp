name: Claude PR Review

# Auto-reviews every PR using the Claude GitHub App, plus responds to
# `@claude` mentions in PR comments and review threads.
#
# Mirrors the proven pattern from apex-bridge/bugspotter's claude-review.yml.
# Requires repo (or org) secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN).

on:
  # Auto-review the PR ONCE on open / ready-for-review / reopen.
  # `synchronize` (per-push) is intentionally excluded — re-reviewing every
  # commit on an open PR burns spend on stale revisions. If a PR moves
  # significantly during review, the requester can re-run via `@claude review`.
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - '*.html'
  # @claude mentions in PR comments and review threads.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Cancel in-flight reviews when new COMMITS are pushed, but NOT on comment
# events — otherwise a reply on a review thread can kill the in-progress
# automatic review for the same ref.
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claude-review:
    name: Claude Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.pull_request) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `issue_comment` and `pull_request_review_comment` events run against
      # the default branch, not the PR's HEAD. Without this step Claude is
      # staring at main and has to discover the PR's contents via repeated
      # `gh pr diff` calls, burning max-turns before it can post anything.
      - name: Checkout PR branch when triggered by comment
        if: |
          github.event_name == 'issue_comment' ||
          github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          gh pr checkout "$PR_NUMBER"

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number || github.event.issue.number }}. Focus on real-impact issues:
            - Auth/security: bypass, injection, missing tenant scoping, credential leak, SSRF
            - Concurrency: races, deadlocks, transactional gaps
            - Missing tests for new behavior
            - Concrete bugs at file:line — name the failure mode

            Skip nits, style, theoretical issues.

            ${{ github.event_name == 'pull_request' && 'Output rules: inline comments only — no top-level summary. If nothing substantive, exit silently (this is an automatic per-push review; silence is the right default).' || 'Output rules: this review was triggered explicitly by a human via @claude — they need to know the action ran and what you concluded. Post inline comments for any real-impact issues you find, then ALWAYS post exactly ONE short top-level comment via `gh pr comment` summarising the outcome (e.g. "Reviewed N files; no real-impact issues found." or "Posted N inline comments — see threads above."). Never exit silently on a human-triggered review.' }}

            Process: read the full diff in one `gh pr diff` call. Use `Grep`
            across the working tree only when a comment would otherwise be
            inaccurate without the surrounding context. Don't enumerate every
            file; pick the riskiest spots. Post inline comments on at most
            5 issues, then stop.
          # `mcp__github_inline_comment__create_inline_comment` is the MCP
          # tool the action uses to buffer inline review comments — without
          # it allow-listed Claude's tool calls get denied and the action
          # exits with "No buffered inline comments" silently.
          #
          # `gh pr comment` is conditionally allow-listed ONLY for
          # comment-triggered (@claude) runs. Per-push auto-runs remain
          # inline-only — silent-exit is the right default.
          #
          # Model: Haiku for auto-runs (cheap per-PR sanity check),
          # Opus for human-triggered @claude pings (deeper read on demand).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob${{ github.event_name != 'pull_request' && ',Bash(gh pr comment:*)' || '' }}"
            --max-turns 25
            --model ${{ github.event_name == 'pull_request' && 'claude-haiku-4-5-20251001' || 'claude-opus-4-7' }}
