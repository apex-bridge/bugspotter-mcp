# nginx config for bugspotter-mcp.
#
# Drop into /etc/nginx/conf.d/ on a host that already runs nginx + certbot.
# Substitute MCP_DOMAIN and the upstream address before reloading.
#
# Streamable HTTP requires SSE, which means nginx must NOT buffer responses
# and must keep idle connections alive past its default read timeout.

upstream bugspotter_mcp {
    # If running on the same host, point at the container's published port.
    # If running cross-host, replace with the container's internal address.
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name MCP_DOMAIN;

    # Let's Encrypt http-01 challenge (if using certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name MCP_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/MCP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/MCP_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Hardening
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    # MCP endpoint — JSON + SSE. The crucial bits are proxy_buffering off
    # and the long read timeout.
    location ~ ^/(mcp|health)(/|$) {
        proxy_pass http://bugspotter_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE prerequisites
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Everything else → 404 JSON. Don't leak that an internal service exists.
    location / {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }

    # Cap request bodies — same as the in-process express.json() limit.
    client_max_body_size 4m;
}
